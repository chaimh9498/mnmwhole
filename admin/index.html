<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>M&M · Owner Dashboard</title>
<style>:root{color-scheme:dark;font:15px system-ui,sans-serif;background:#101111;color:#f3f0e8;--gold:#d7b776;--muted:#aea89e}*{box-sizing:border-box}body{margin:0}a{color:var(--gold)}button,input,textarea{font:inherit}button{cursor:pointer}header{background:#1a1b1c;border-bottom:1px solid #51452f;padding:18px max(20px,calc((100vw - 1050px)/2));display:flex;justify-content:space-between;align-items:center;gap:15px}main{max-width:1050px;margin:auto;padding:48px 20px 90px}h1{font-size:42px;letter-spacing:-.04em}.eyebrow{color:var(--gold);letter-spacing:.13em;font-size:11px;font-weight:800}.notice{background:#322815;border:1px solid #927247;border-radius:10px;padding:18px;margin:22px 0;line-height:1.6}.error{background:#3b1717;border-color:#923f3f}.success{background:#17331e;border-color:#3f7d4b}.layout{display:grid;grid-template-columns:1fr 1fr;gap:22px}.panel{background:#1c1d1d;border:1px solid #453d31;border-radius:14px;padding:25px}label{display:block;margin:16px 0 7px;color:#d2ccc1;font-weight:650;font-size:13px}input,textarea{width:100%;padding:13px;border-radius:8px;background:#111;border:1px solid #5b5040;color:white;outline:none}input[type=checkbox]{width:auto}.checks{display:flex;gap:20px;margin-top:16px}.checks label{margin:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.btn{padding:12px 18px;border:0;border-radius:8px;background:var(--gold);color:#1c170f;font-weight:800}.secondary{border:1px solid #6f5c3c;background:transparent;color:var(--gold)}.danger{border-color:#8d4141;color:#ffb6b6}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}.item{padding:14px 0;border-bottom:1px solid #37322a;display:flex;justify-content:space-between;gap:12px}.item small{display:block;color:var(--muted);margin-top:5px}.item button{background:transparent;color:var(--gold);border:1px solid #695334;padding:8px;border-radius:6px}.help{font-size:12px;color:var(--muted);line-height:1.6}.hidden,[hidden]{display:none!important}.preview{max-width:100%;max-height:160px;object-fit:contain;border-radius:8px;margin-top:8px}#authBox{text-align:center;padding:55px 20px}@media(max-width:780px){.layout{grid-template-columns:1fr}.grid{grid-template-columns:1fr}}</style></head>
<body><header><strong>M&M · Owner Dashboard</strong><div><span id="userButton"></span> <a href="../">← Catalog</a></div></header><main><div class="eyebrow">SECURE INVENTORY MANAGEMENT</div><h1>Manage listings<span style="color:var(--gold)">.</span></h1>
<section id="authBox" class="panel"><h2>Owner sign-in required</h2><p class="help">Sign in with the owner account to publish products and upload images.</p><button class="btn" id="signIn" type="button">Sign in</button></section>
<div id="status" class="notice hidden"></div><div id="dashboard" class="layout hidden"><section class="panel"><h2 id="formTitle">New listing</h2><form id="form"><label for="name">Product name *</label><input id="name" required maxlength="150"><div class="grid"><div><label for="price">Price (USD) *</label><input id="price" type="number" required min="0" step=".01"></div><div><label for="stock">Quantity *</label><input id="stock" type="number" required min="0" step="1"></div></div><div class="grid"><div><label for="category">Category</label><input id="category" maxlength="70"></div><div><label for="sku">SKU</label><input id="sku" maxlength="70"></div></div><label for="description">Description</label><textarea id="description" rows="4" maxlength="3000"></textarea><div class="checks"><label><input id="active" type="checkbox"> Public listing</label><label><input id="featured" type="checkbox"> Featured</label></div><label for="image">Product image</label><input id="image" type="file" accept="image/png,image/jpeg,image/webp"><img id="preview" class="preview hidden" alt="Selected image"><p class="help">JPG, PNG, or WEBP; maximum 5 MB. The image uploads to Cloudflare R2 after the listing is saved.</p><div class="actions"><button class="btn" type="submit">Save listing</button><button type="button" class="btn secondary" id="clear">New listing</button></div></form></section><section class="panel"><h2>Listings <span id="count" style="color:var(--gold)">0</span></h2><div id="items"></div></section></div></main>
<script async crossorigin="anonymous" data-clerk-publishable-key="pk_live_Y2xlcmsubW5td2hvbGUuY29tJA" src="https://cdn.jsdelivr.net/npm/@clerk/clerk-js@5/dist/clerk.browser.js"></script>
<script>(()=>{'use strict';const API='https://mnmwhole-api.chaimh9498.workers.dev',$=id=>document.getElementById(id);let rows=[],editing=null,previewUrl=null;async function token(){return window.Clerk?.session?.getToken()}async function api(path,options={}){const headers=new Headers(options.headers||{}),jwt=await token();if(jwt)headers.set('Authorization','Bearer '+jwt);const response=await fetch(API+path,{...options,headers});let data={};try{data=await response.json()}catch{}if(!response.ok)throw Object.assign(Error(data.error||'Request failed'),{status:response.status,data});return data}function message(text,type=''){const box=$('status');box.textContent=text;box.className='notice '+type;box.hidden=false}function clearForm(){editing=null;$('form').reset();$('formTitle').textContent='New listing';if(previewUrl)URL.revokeObjectURL(previewUrl);previewUrl=null;$('preview').src='';$('preview').classList.add('hidden')}function edit(row){editing=row.id;$('name').value=row.name;$('price').value=(row.priceCents/100).toFixed(2);$('stock').value=row.stock;$('category').value=row.category||'';$('sku').value=row.sku||'';$('description').value=row.description||'';$('active').checked=row.active;$('featured').checked=row.featured;$('formTitle').textContent='Edit listing';scrollTo({top:0,behavior:'smooth'})}async function remove(row){if(!confirm('Delete '+row.name+' and its images?'))return;await api('/api/admin/products/'+encodeURIComponent(row.id),{method:'DELETE'});message('Listing deleted.','success');await load()}function render(){const box=$('items');box.replaceChildren();$('count').textContent=rows.length;if(!rows.length){const p=document.createElement('p');p.className='help';p.textContent='No listings yet.';box.append(p)}for(const row of rows){const item=document.createElement('div');item.className='item';const text=document.createElement('div'),label=document.createElement('b'),small=document.createElement('small');label.textContent=row.name;small.textContent='$'+(row.priceCents/100).toFixed(2)+' · Qty '+row.stock+' · '+(row.active?'Public':'Draft')+' · '+row.images.length+' image(s)';text.append(label,small);const actions=document.createElement('div'),editButton=document.createElement('button'),deleteButton=document.createElement('button');editButton.textContent='Edit';editButton.onclick=()=>edit(row);deleteButton.textContent='Delete';deleteButton.onclick=()=>remove(row).catch(error=>message(error.message,'error'));actions.append(editButton,deleteButton);item.append(text,actions);box.append(item)}}async function load(){const data=await api('/api/admin/products');rows=data.products||[];render();$('dashboard').classList.remove('hidden');$('authBox').hidden=true;message('Owner access confirmed. Listings publish to the live catalog.','success')}async function init(){if(!window.Clerk)return;await window.Clerk.load();$('signIn').onclick=()=>window.Clerk.openSignIn();if(!window.Clerk.user)return;window.Clerk.mountUserButton($('userButton'),{afterSignOutUrl:'https://mnmwhole.com'});try{await load()}catch(error){if(error.status===403){message('This signed-in account is not authorized as the owner yet. Clerk user ID: '+(error.data?.userId||window.Clerk.user.id),'error')}else message(error.message,'error')}}$('image').onchange=event=>{if(previewUrl)URL.revokeObjectURL(previewUrl);const file=event.target.files[0];if(!file)return;if(!['image/jpeg','image/png','image/webp'].includes(file.type)||file.size>5*1024*1024){message('Use a JPG, PNG, or WEBP image under 5 MB.','error');event.target.value='';return}previewUrl=URL.createObjectURL(file);$('preview').src=previewUrl;$('preview').classList.remove('hidden')};$('clear').onclick=clearForm;$('form').onsubmit=async event=>{event.preventDefault();const dollars=Number($('price').value),stock=Number($('stock').value);if(!Number.isFinite(dollars)||dollars<0||!Number.isSafeInteger(stock)||stock<0){message('Enter a valid price and quantity.','error');return}const body={name:$('name').value.trim(),priceCents:Math.round(dollars*100),stock,category:$('category').value.trim(),sku:$('sku').value.trim(),description:$('description').value.trim(),active:$('active').checked,featured:$('featured').checked};try{const result=await api(editing?'/api/admin/products/'+encodeURIComponent(editing):'/api/admin/products',{method:editing?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const productId=result.product.id,file=$('image').files[0];if(file){const form=new FormData();form.append('image',file);form.append('altText',body.name);await api('/api/admin/products/'+encodeURIComponent(productId)+'/images',{method:'POST',body:form})}message('Listing saved to the live catalog.','success');clearForm();await load()}catch(error){message(error.message,'error')}};window.addEventListener('load',()=>init().catch(error=>message(error.message,'error')));})();</script></body></html>
